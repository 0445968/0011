name: Bivi project checks

on:
  push:
    branches:
      - bivi-tasks-reference-redesign
  pull_request:
    branches:
      - restore
  workflow_dispatch:

concurrency:
  group: bivi-projects-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout changes
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run platform tests
        run: npm run verify:platform
      - name: Production build
        run: npm run build
